version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_testing_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_testing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_testing_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/ai_testing_db
      - SECRET_KEY=prod_super_secret_key_32_characters_long_spec
      - AI_PROVIDER=mock
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_testing_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
